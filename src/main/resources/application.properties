spring.application.name=badminton-match-scheduler
server.port=${PORT:8000}

llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
llm.api-key=${GEMINI_API_KEY:}
llm.model=${LLM_MODEL:gemini-3.5-flash}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:60}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8000,http://localhost:8080,http://127.0.0.1:5500}
